<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>

    <title>Document</title>
  </head>
  <body>
    <header>
      <div
        class="flex justify-between bg-slate-700 color text-white items-center p-[20px]"
      >
        <div class="flex w-20 h-20px">
          <div class="logo">
            <!-- <img src="images/image_ec4fb5e3.jpg" alt="logo" /> -->
          </div>
          <p>TACHKILA</p>
        </div>
        <div>
          <ul class="flex bg-slate-800 p-[10px] gap-[10px] rounded-[10px]">
            <li
              class="px-4 py-2 [&.active]:bg-green-600 [&.active]:text-white active"
            >
              <a href="index.html"> Effectifs </a>
            </li>
            <li class="px-4 py-2 [&.active]:bg-green-600 [&.active]:text-white">
              <a href="compsition.html"> Composition </a>
            </li>
            <li class="px-4 py-2 [&.active]:bg-green-600 [&.active]:text-white">
              <a href="matchs.html"> Matchs </a>
            </li>
          </ul>
        </div>
        <div class="team-info flex gap-5">
          <div class="team1 text-yellow-300">GB</div>
          <div class="team2 text-blue-700">DEF</div>
          <div class="team3 text-green-300">MIL</div>
          <div class="team4 text-orange-500">ATT</div>
        </div>
      </div>
    </header>
    <main>
      <div class="head flex justify-between items-center p-[20px]">
        <div class="">
          <h2 class="font-bold">Effectif</h2>
          <p class="mt-[10px]">gerer les houeurs du club atlas FC</p>
        </div>
        <button
          class="addNewPlayer bg-green-500 text-white p-[10px] rounded-[10px]"
        >
          Ajouter un joueur
        </button>
      </div>
      <div
        class="search-Container flex justify-between mt-[30px] bg-slate-500 p-[20px]"
      >
        <input
          placeholder="search for player"
          class="playersSearchInput w-[60%] border-balck border-2 rounded-md"
        />

        <ul class="flex gap-1 text-white" id="playersUl">
          <li
            class="p-[3px] px-4 py-2 [&.active]:bg-green-600 [&.active]:text-white active hover:"
          >
            tous
          </li>
          <li
            class="p-[3px] px-4 py-2 [&.active]:bg-green-600 [&.active]:text-white"
          >
            GB
          </li>
          <li
            class="p-[3px] px-4 py-2 [&.active]:bg-green-600 [&.active]:text-white"
          >
            DF
          </li>
          <li
            class="p-[3px] px-4 py-2 [&.active]:bg-green-600 [&.active]:text-white"
          >
            ML
          </li>
          <li
            class="p-[3px] px-4 py-2 [&.active]:bg-green-600 [&.active]:text-white"
          >
            ATT
          </li>
        </ul>
      </div>
      <div
        class="mt-[20px] bg-slate-700 flex p-[20px] flex-wrap gap-[20px]"
        id="playersList"
      >
        <div
          class="player p-[20px] border-black border-[1px] w-fit bg-slate-600"
        >
          <div
            class="information flex flex-wrap gap-[5px] justify-between items-center"
          >
            <p
              class="number p-[5px] rounded-[50%] border-white border-[1px] text-white"
            >
              3
            </p>
            <p class="name text-white font-medium">abdelghani</p>
            <p class="position font-medium text-white">DEF</p>
            <p class="age w-full text-gray-400">Age: 22 ans</p>
          </div>

          <div
            class="actionButtons flex justify-between items-center mt-[10px]"
          >
            <p class="health text-white border-white p-[5px]">En forme</p>
            <div
              class="actions flex justify-end items-center gap-[14px] text-white"
            >
              <button class="captain text-[25px]">c</button>
              <button class="edit">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-square-pen preview-icon"
                >
                  <path
                    d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
                  />
                  <path
                    d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"
                  />
                </svg>
              </button>
              <button class="delete">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-trash preview-icon"
                >
                  <path d="M10 11v6" />
                  <path d="M14 11v6" />
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                  <path d="M3 6h18" />
                  <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!-- player modal -->
    <div class="cardParent bg-black/60 absolute w-[100%] h-[100%] top-0">
      <div
        class="addEditPlayerCard flex flex-col gap-[20px] absolute top-[calc(50%-140px)] left-[calc(50%-150px)] bg-gray-500 text-white w-[320px] p-[10px] radius-[10px]"
      >
        <form id="form">
          <div class="row1 flex justify-between">
            <div class="title font-medium">Aouter un joueur</div>
            <button
              type="button"
              class="close text-white-500 p-[2px] bg-rose-500 rounded-[50%] w-[30px] h-[30px] text-center"
            >
              x
            </button>
          </div>
          <div class="row2 flex flex-col">
            <!-- full name -->
            <label for="playerName" class="text-xs">Nom Complete</label>
            <input
              class="text-black"
              type="text"
              id="playerName"
              name="playerName"
              placeholder="Ex. ayoub mansouri"
            />
            <label class="nameErrLabel hidden text-red-500 hiddden"
              >no special characters or numbers</label
            >
          </div>
          <div class="postes">
            <p class="w-[100%]">poste</p>
            <!-- inputs choices -->
            <div class="flex justify-center">
              <!-- gardien -->
              <div
                class="flex gap-1 w-[50%] border rounded-md p-1 has-[:checked]:border-orange-500"
              >
                <input
                  name="postes"
                  checked
                  id="gardien"
                  type="radio"
                  value="gardien"
                  class="poste appearance-none rounded-md before:content-[''] before:bg-orange-500 before:rounded-[50%] before:inline-block before:w-[6px] before:h-[6px] before:top-[50%]"
                />
                <label for="gardien">Gardien</label>
              </div>
              <!-- defender -->
              <div
                class="flex gap-1 w-[50%] border rounded-md p-2 has-[:checked]:border-blue-500"
              >
                <input
                  name="postes"
                  id="defender"
                  type="radio"
                  value="defender"
                  class="poste appearance-none rounded-md before:content-[''] before:bg-blue-500 before:rounded-[50%] before:inline-block before:w-[6px] before:h-[6px] before:top-[50%]"
                />
                <label for="defender">Défenseur</label>
              </div>
            </div>
            <div class="flex justify-center">
              <!-- medium -->
              <div
                class="flex gap-1 w-[50%] border rounded-md p-2 has-[:checked]:border-green-500"
              >
                <input
                  name="postes"
                  id="medium"
                  type="radio"
                  value="medium"
                  class="poste appearance-none rounded-md before:content-[''] before:bg-green-500 before:rounded-[50%] before:inline-block before:w-[6px] before:h-[6px] before:top-[50%]"
                />
                <label for="medium">Milleu</label>
              </div>
              <!-- attacker -->
              <div
                class="flex gap-1 w-[50%] border rounded-md p-2 has-[:checked]:border-red-500"
              >
                <input
                  name="postes"
                  id="attacker"
                  type="radio"
                  value="attacker"
                  class="poste appearance-none rounded-md before:content-[''] before:bg-red-500 before:rounded-[50%] before:inline-block before:w-[6px] before:h-[6px] before:top-[50%]"
                />
                <label for="attacker">Attaquant</label>
              </div>
            </div>
          </div>

          <div class="row3 flex flex-col">
            <label for="playerNumber">Numéro (1 a 99):</label>
            <input
              type="number"
              class="text-black"
              id="playerNumber"
              name="playerNumber"
              placeholder="Ex. 7"
            />

            <label for="playerAge" class="mt-[10px]">Age:</label>
            <input
              type="number"
              class="text-black"
              id="playerAge"
              name="playerAge"
              placeholder="Ex. 25"
            />
            <p class="mt-[10px]">Status de joueur:</p>
            <select
              id="selectPlayerStatus"
              class="selectPlayerStatus mt-[10px] text-black"
            ></select>
            <label class="playerErrLabel hidden text-red-500 hiddden"
              >Number must be between 1 and 99, and not taken by another
              player</label
            >
            <label class="slotNotEmptyError hidden text-red-500 hiddden"
              >All slots in that position are not empty</label
            >
          </div>
          <div class="actionButtons p-2 flex justify-end gap-[10px]">
            <button type="submit" class="add p-1 bg-green-500 rounded-md">
              Ajouter
            </button>
            <button type="button" class="cancel p-1 bg-gray-900 rounded-md">
              Annuler
            </button>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="js/page-effectif.js"></script>
    <script type="module" src="js/players.js"></script>
  </body>
</html>
