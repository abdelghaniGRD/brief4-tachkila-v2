<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="css/style.css" />
  </head>
  <body>
    <header>
      <div
        class="flex justify-between bg-slate-700 color text-white items-center p-[20px]"
      >
        <div class="flex w-20 h-20px">
          <div class="logo">
            <!-- <img src="images/image_ec4fb5e3.jpg" alt="logo" /> -->
          </div>
          <p>TACHKILA</p>
        </div>
        <div>
          <ul class="flex bg-slate-800 p-[10px] gap-[10px] rounded-[10px]">
            <li class="px-4 py-2 [&.active]:bg-green-600 [&.active]:text-white">
              <a href="index.html"> Effectifs </a>
            </li>
            <li class="px-4 py-2 [&.active]:bg-green-600 [&.active]:text-white">
              <a href="compsition.html"> Composition </a>
            </li>
            <li
              class="px-4 py-2 text-gray-700 [&.active]:bg-green-600 [&.active]:text-white active"
            >
              <a href="matchs.html"> Matchs </a>
            </li>
          </ul>
        </div>
        <div class="team-info flex gap-5">
          <div class="team1 text-yellow-300">GB</div>
          <div class="team2 text-blue-700">DEF</div>
          <div class="team3 text-green-300">MIL</div>
          <div class="team4 text-orange-500">ATT</div>
        </div>
      </div>
    </header>
    <main>
      <div class="head flex justify-between items-center p-[20px]">
        <div class="">
          <h2 class="font-bold">Matches</h2>
          <p class="mt-[10px]">
            Calendrie de et résultats de la saison 2026/2027
          </p>
        </div>
        <button
          class="addNewMatch bg-green-500 text-white p-[10px] rounded-[10px]"
        >
          + Ajouter un match
        </button>
      </div>
      <div
        class="search-Container flex justify-between mt-[30px] bg-slate-500 p-[20px]"
      >
        <input
          placeholder="search for match"
          class="matchesSearchInput w-[60%] border-balck border-2 rounded-md"
        />

        <ul class="flex gap-1 text-white" id="playersUl">
          <li
            data-position="all"
            class="p-[3px] px-4 py-2 [&.active]:bg-green-600 [&.active]:text-white active hover:"
          >
            Tous
          </li>
          <li
            data-position="future"
            class="p-[3px] px-4 py-2 [&.active]:bg-green-600 [&.active]:text-white"
          >
            A venir
          </li>
          <li
            data-position="played"
            class="p-[3px] px-4 py-2 [&.active]:bg-green-600 [&.active]:text-white"
          >
            joués
          </li>
        </ul>
      </div>
    </main>
    <!-- match modal -->
    <div class="cardParent bg-black/60 absolute w-[100%] h-[100%] top-0">
      <div
        class="addEditMatchCard flex flex-col gap-[20px] absolute top-[calc(50%-140px)] left-[calc(50%-150px)] bg-gray-500 text-white w-[320px] p-[10px] radius-[10px]"
      >
        <form id="form">
          <div class="row1 flex justify-between">
            <div class="title font-medium">Aouter un match</div>
            <button
              type="button"
              class="close text-white-500 p-[2px] bg-rose-500 rounded-[50%] w-[30px] h-[30px] text-center"
            >
              x
            </button>
          </div>
          <div class="row2 flex flex-col">
            <!-- full name -->
            <label for="opponentName" class="text-xs">Adversaire :</label>
            <input
              class="text-black"
              type="text"
              id="opponentName"
              name="opponentName"
            />
            <label class="nameErrLabel hidden text-red-500 hiddden"
              >no special characters or numbers
            </label>
          </div>

          <div class="row3 flex flex-col">
            <!-- date -->
            <label for="date">Date :</label>
            <input type="date" class="text-black" id="date" name="date" />

            <label class="numberErrLabel hidden text-red-500 hiddden"
              >number must be between 1 and 99 and not taken by another
              player</label
            >

            <!-- time -->
            <label for="time" class="mt-[10px]">Time :</label>
            <input type="time" class="text-black" id="time" name="time" />

            <label class="ageErrLabel hidden text-red-500 hiddden"
              >age must be between 18 and 35</label
            >

            <!-- Place -->
            <label for="place" class="mt-[10px]">Lieu :</label>
            <input type="place" class="text-black" id="place" name="place" />

            <!-- Place selection-->

            <div class="matchPlace">
              <p class="w-[100%]">Lieu de match</p>
              <!-- inputs choices -->
              <div class="flex justify-center">
                <!-- domicile -->
                <div
                  class="flex gap-1 w-[50%] border rounded-md p-1 has-[:checked]:border-green-500"
                >
                  <input
                    name="matchPlace"
                    checked
                    id="domicile"
                    type="radio"
                    value="domicile"
                    class="poste appearance-none rounded-md before:content-[''] before:bg-orange-500 before:rounded-[50%] before:inline-block before:w-[6px] before:h-[6px] before:top-[50%]"
                  />
                  <label for="domicile">Domicile</label>
                </div>
                <!-- exterieur -->
                <div
                  class="flex gap-1 w-[50%] border rounded-md p-2 has-[:checked]:border-green-500"
                >
                  <input
                    name="matchPlace"
                    id="outside"
                    type="radio"
                    value="outside"
                    class="poste appearance-none rounded-md before:content-[''] before:bg-blue-500 before:rounded-[50%] before:inline-block before:w-[6px] before:h-[6px] before:top-[50%]"
                  />
                  <label for="outside">Extérieur</label>
                </div>
              </div>
            </div>

            <label class="generalError hidden text-red-500 hiddden"
              >All slots in that position are not empty</label
            >
          </div>

          <!-- form -->
          <div class="actionButtons p-2 flex justify-end gap-[10px]">
            <button type="submit" class="add p-1 bg-green-500 rounded-md">
              Ajouter
            </button>
            <button type="button" class="cancel p-1 bg-gray-900 rounded-md">
              Annuler
            </button>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="js/page-matchs.js"></script>
  </body>
</html>
